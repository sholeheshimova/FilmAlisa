<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="./src/styles/global.css" />
    <link rel="stylesheet" href="./src/pages/login/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <main class="login-container">
      <img
        class="logo"
        src="./src/assets/icons/filmalisa-logo.svg"
        alt="filmalisa-logo"
      />

      <h1 class="login-title">Admin</h1>

      <form class="form-box">
        <div class="input-box">
          <i
            class="fa-regular fa-user"
            style="color: var(--login-register-input-text-color)"
          ></i>
          <input
            id="username"
            class="input username"
            type="text"
            placeholder="username"
          />
        </div>

        <div class="input-box">
          <img src="./src/assets/icons/password.svg" alt="password" />
          <input
            id="password"
            class="input password"
            type="password"
            placeholder="password"
          />
          <img id="password-eye" src="./src/assets/icons/eye.svg" alt="eye" />
        </div>

        <button id="login-button" class="login-button">
          <a href="./src/pages/dashboard/dashboard.html">login</a>
        </button>
      </form>
    </main>

    <script src="./src/pages/login/login.js"></script>
  </body>
</html>
