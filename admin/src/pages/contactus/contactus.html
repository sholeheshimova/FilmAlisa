<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="./contactus.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <img src="../../assets/icons/filmalisa-logo.svg" alt="" />
        </div>
        <span class="logo-text">filmalisa</span>
      </div>

      <nav class="sidebar-menu">
        <a href="../dashboard/dashboard.html" class="menu-item">
          <span class="menu-icon"
            ><img src="../../assets/icons/dashboard.svg" alt=""
          /></span>
          <span>Dashboard</span>
        </a>

        <a href="../movies/movies.html" class="menu-item">
          <span class="menu-icon"
            ><img src="../../assets/icons/movies.svg" alt=""
          /></span>
          <span>Movies</span>
        </a>

        <a href="../categories/categories.html" class="menu-item">
          <span class="menu-icon"
            ><img src="../../assets/icons/categories.svg" alt=""
          /></span>
          <span>Categories</span>
        </a>

        <a href="../users/users.html" class="menu-item">
          <span class="menu-icon"
            ><img src="../../assets/icons/users.svg" alt=""
          /></span>
          <span>Users</span>
        </a>

        <a href="../comments/comments.html" class="menu-item">
          <span class="menu-icon"
            ><img src="../../assets/icons/comments.svg" alt=""
          /></span>
          <span>Comments</span>
        </a>

        <a href="./contactus.html" class="menu-item active">
          <span class="menu-icon"
            ><img src="../../assets/icons/contact.svg" alt=""
          /></span>
          <span>Contact us</span>
        </a>

        <a href="../actors/actors.html" class="menu-item">
          <span class="menu-icon"
            ><img src="../../assets/icons/users.svg" alt=""
          /></span>
          <span>Actors</span>
        </a>
      </nav>
      <div class="sidebar-bottom">
        <a href="../../../index.html" class="logout">
          <span class="logout-icon"
            ><img src="../../assets/icons/logaut.svg" alt=""
          /></span>
          <span>Logout</span>
        </a>
      </div>
    </aside>

    <!-- Page Header -->

    <main class="main-content">
      <header class="admin-header">
        <div class="header-left">
          <span class="header-greeting">Hi Admin</span>
          <h1>Contact Us</h1>
        </div>

        <div class="header-right">
          <div class="profile">
            <div class="profile-image">
              <img src="../../assets/image/admin-profile.svg" alt="Admin" />
            </div>

            <span class="profile-name">Admin</span>
          </div>
        </div>
      </header>

      <section class="page-content">
        <div class="movies-table-wrap">
          <table class="movies-table">
            <thead>
              <tr>
                <th class="col-id">ID</th>
                <th class="col-name">Name</th>
                <th class="col-email">Email</th>
                <th class="col-msg">Message</th>
                <th class="col-action">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>User Name</td>
                <td>username@gmail.com</td>
                <td>Lorem ipsum test...</td>
                <td>
                  <button class="delete-btn">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <div class="modal-overlay" id="deleteModal">
      <div class="delete-modal-card">
        <h2>Delete Contact</h2>
        <p>Are you sure you want to delete this contact?</p>
        <div class="modal-actions">
          <button class="btn-cancel">Cancel</button>
          <button class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <script src="./contactus.js"></script>
  </body>
</html>
