<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <link rel="stylesheet" href="../../styles/global.css" />
  <link rel="stylesheet" href="../../styles/admin-pagination.css" />
  <link rel="stylesheet" href="./contactus.css" />
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="sidebar-logo">
      <div class="logo-icon">
        <img src="../../assets/icons/filmalisa-logo.svg" alt="" />
      </div>
      <span class="logo-text">filmalisa</span>
    </div>

    <nav class="sidebar-menu">

      <a href="../dashboard/dashboard.html" class="menu-item">
        <span class="menu-icon">
          <img src="../../assets/icons/dashboard.svg" alt="" />
        </span>
        <span>Dashboard</span>
      </a>

      <a href="../movies/movies.html" class="menu-item">
        <span class="menu-icon">
          <img src="../../assets/icons/movies.svg" alt="" />
        </span>
        <span>Movies</span>
      </a>

      <a href="../categories/categories.html" class="menu-item">
        <span class="menu-icon">
          <img src="../../assets/icons/categories.svg" alt="" />
        </span>
        <span>Categories</span>
      </a>

      <a href="../users/users.html" class="menu-item">
        <span class="menu-icon">
          <img src="../../assets/icons/users.svg" alt="" />
        </span>
        <span>Users</span>
      </a>

      <a href="../comments/comments.html" class="menu-item">
        <span class="menu-icon">
          <img src="../../assets/icons/comments.svg" alt="" />
        </span>
        <span>Comments</span>
      </a>

      <a href="./contactus.html" class="menu-item active">
        <span class="menu-icon">
          <img src="../../assets/icons/contact.svg" alt="" />
        </span>
        <span>Contact us</span>
      </a>

      <a href="../actors/actors.html" class="menu-item">
        <span class="menu-icon">
          <img src="../../assets/icons/users.svg" alt="" />
        </span>
        <span>Actors</span>
      </a>

    </nav>

    <div class="sidebar-bottom">
      <a href="../../../index.html" class="logout">
        <span class="logout-icon">
          <img src="../../assets/icons/logaut.svg" alt="" />
        </span>
        <span>Logout</span>
      </a>
    </div>

  </aside>

  <main class="main-content">

    <header class="admin-header">

      <div class="header-left">
        <span class="header-greeting">Hi Admin</span>
        <h1>Contact Us</h1>
      </div>

      <div class="header-right">
        <div class="profile">
          <div class="profile-image">
            <img src="../../assets/image/admin-profile.svg" alt="Admin" />
          </div>

          <span class="profile-name">Admin</span>
        </div>
      </div>

    </header>

    <section class="page-content">

      <div class="movies-table-wrap">

        <table class="movies-table">

          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th class="col-name">Name</th>
              <th class="col-email">Email</th>
              <th class="col-msg">Message</th>
              <th class="col-action">Actions</th>
            </tr>
          </thead>

          <tbody id="tableBody"></tbody>

        </table>

      </div>

      <nav
        class="table-pager d-none"
        aria-label="Contact requests table pages"
      ></nav>

    </section>

  </main>

  <!-- Delete modal -->
  <div class="delete-modal">

    <div class="delete-modal-content">

      <h3>Delete Contact</h3>

      <p>Are you sure you want to delete this contact?</p>

      <div class="delete-modal-actions">

        <button type="button" class="delete-cancel-btn">
          Cancel
        </button>

        <button type="button" class="confirm-delete-btn">
          OK
        </button>

      </div>

    </div>

  </div>

  <!-- View message modal -->
  <div class="edit-modal">

    <div class="edit-modal-content">

      <h3>Message</h3>

      <label for="edit-message"></label>

      <textarea id="edit-message" readonly></textarea>

      <div class="edit-modal-actions">

        <button type="button" class="cancel-edit-btn">
          Close
        </button>

      </div>

    </div>

  </div>

  <script type="module" src="./contactus.js"></script>

</body>

</html>
