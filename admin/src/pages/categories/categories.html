<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="./categories.css">
</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <img src="../../assets/icons/filmalisa-logo.svg" alt="" />
      </div>
      <span class="logo-text">filmalisa</span>
    </div>
    <nav class="sidebar-menu">
      <a href="../dashboard/dashboard.html" class="menu-item">
        <span class="menu-icon"><img src="../../assets/icons/dashboard.svg" alt="" /></span>
        <span>Dashboard</span>
      </a>

      <a href="../movies/movies.html" class="menu-item">
        <span class="menu-icon"><img src="../../assets/icons/movies.svg" alt="" /></span>
        <span>Movies</span>
      </a>

      <a href="./categories.html" class="menu-item active">
        <span class="menu-icon"><img src="../../assets/icons/categories.svg" alt="" /></span>
        <span>Categories</span>
      </a>

      <a href="../users/users.html" class="menu-item">
        <span class="menu-icon"><img src="../../assets/icons/users.svg" alt="" /></span>
        <span>Users</span>
      </a>

      <a href="../comments/comments.html" class="menu-item">
        <span class="menu-icon"><img src="../../assets/icons/comments.svg" alt="" /></span>
        <span>Comments</span>
      </a>

      <a href="../contactus/contactus.html" class="menu-item">
        <span class="menu-icon"><img src="../../assets/icons/contact.svg" alt="" /></span>
        <span>Contact us</span>
      </a>

      <a href="../actors/actors.html" class="menu-item">
        <span class="menu-icon"><img src="../../assets/icons/users.svg" alt="" /></span>
        <span>Actors</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <a href="../../../index.html" class="logout">
        <span class="logout-icon"><img src="../../assets/icons/logaut.svg" alt="" /></span>
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <!-- Page Header-->
  <main class="main-content">
    <header class="admin-header">
      <div class="header-left">
        <span class="header-greeting">Hi Admin</span>
        <h1>Categories</h1>
      </div>
      <div class="header-right">
        <!-- MODAL Btn-->
        <button type="button" class="create-btn"
          onclick="document.querySelector('#example-dialog').showModal()">Create</button>

        <div class="profile">
          <div class="profile-image">
            <img src="../../assets/image/admin-profile.svg" alt="Admin" />
          </div>

          <span class="profile-name">Admin</span>
        </div>
      </div>
    </header>
    <section class="page-content">
      <!-- MODAL -->
      <dialog id="example-dialog">
        <form class="dialog__form" id="contact-form" method="dialog">
          <div class="dialog__header">
            <h2>Create a new category</h2>
          </div>

          <div class="dialog__body">
            <div class="input-group">
              <label for="modal-name">Category</label>
              <input type="text" id="modal-name" required />
            </div>
          </div>

          <div class="dialog__footer">
            <button commandfor="example-dialog" command="request-close" type="button" class="btn"
              onclick="this.closest('dialog').close()">Cancel</button>
            <button type="submit" class="btn cta" id="submit-dialog">Submit</button>
          </div>
        </form>
      </dialog>
      <!-- CEDVEL -->
      <div class="table-wrapper">
        <table class="table">

          <thead class="thead">
            <tr class="row">
              <th class="cell head">ID</th>
              <th class="cell head">Category</th>
              <th class="cell head actions-col">Actions</th>
            </tr>
          </thead>

          <tbody class="tbody">
            <tr class="row" data-id="1">
              <td class="cell">1</td>
              <td class="cell row-name">DRAM</td>
              <td class="cell actions">
                <button type="button" class="edit" aria-label="Edit actor"><i
                    class="fa-solid fa-pen-to-square"></i></button>
                <button type="button" class="delete" aria-label="Delete actor"><i
                    class="fa-solid fa-trash"></i></button>
              </td>
            </tr>
          </tbody>

        </table>
      </div>




      <!-- DELETE MODAL -->
<div class="delete-modal">
  <div class="delete-modal-content">
    <h3>Delete Category</h3>

    <p>Are you sure you want to delete this category?</p>

    <div class="delete-modal-actions">
      <button type="button" class="cancel-btn">Cancel</button>
      <button type="button" class="confirm-delete-btn">OK</button>
    </div>
  </div>
</div>


<!-- EDIT MODAL -->
<div class="edit-modal">
  <div class="edit-modal-content">

    <h3>Edit Category</h3>

    <div class="edit-input-group">
      <label for="edit-category">Category</label>
      <input type="text" id="edit-category" />
    </div>

    <div class="edit-modal-actions">
      <button type="button" class="edit-cancel-btn">
        Cancel
      </button>

      <button type="button" class="edit-submit-btn">
        Submit
      </button>
    </div>

  </div>
</div>
    </section>
  </main>
  <script src="./categories.js"></script>
</body>

</html>
