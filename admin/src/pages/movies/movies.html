<div class="edit-modal" id="editMovieModal">
  <div class="edit-modal-content">

    <div class="edit-modal-form">
      <h3>Edit Movie</h3>

      <label for="edit-title">Title</label>
      <input type="text" id="edit-title" placeholder="Film adı">

      <label for="edit-description">Description</label>
      <textarea id="edit-description" placeholder="Təsvir yaz..."></textarea>

      <label for="edit-image">Image URL</label>
      <input type="text" id="edit-image" placeholder="Şəkil linki">

      <label for="edit-video">Video URL</label>
      <input type="text" id="edit-video" placeholder="Video linki">

      <label for="edit-download">Download URL</label>
      <input type="text" id="edit-download" placeholder="Yükləmə linki">

      <div class="edit-modal-row">
        <div class="edit-modal-col">
          <label for="edit-rating">Rating</label>
          <input type="text" id="edit-rating" placeholder="6.0">
        </div>
        <div class="edit-modal-col">
          <label for="edit-duration">Duration</label>
          <input type="text" id="edit-duration" placeholder="99">
        </div>
      </div>

      <label for="edit-actors">Actors</label>
      <select id="edit-actors">
        <option>Jack Black, Paul Rudd</option>
        <option>Leonardo DiCaprio</option>
        <option>Tom Hardy</option>
      </select>

      <label for="edit-genre">Genre</label>
      <select id="edit-genre">
        <option>Comedy</option>
        <option>Action</option>
        <option>Sci-Fi & Fantasy</option>
        <option>Drama</option>
      </select>

      <div class="edit-modal-footer">
        <label class="edit-adult-label">
          <input type="checkbox" id="edit-adult"> Adult
        </label>

        <div class="edit-modal-actions">
          <button type="button" class="save-edit-btn" id="saveEditBtn">Edit</button>
        </div>
      </div>
    </div>

    <div class="edit-modal-preview">
      <img src="../../assets/image/movie-poster.svg" alt="Movie Poster" id="editPreviewImg">
    </div>

  </div>
</div>

</main>

    <!-- modaldı js aktiv olduğdan soram qoşulacaq  -->

    <div class="modal-overlay">
      <div class="create-modal-card">
        <form class="modal-form">
          <div class="form-group">
            <input type="text" placeholder="title" name="title" />
          </div>

          <div class="form-group">
            <textarea
              placeholder="overview"
              name="overview"
              rows="3"
            ></textarea>
          </div>

          <div class="form-group">
            <input type="text" placeholder="cover url" name="coverUrl" />
          </div>

          <div class="form-group">
            <input
              type="text"
              placeholder="fragman (youtube embed url)"
              name="trailerUrl"
            />
          </div>

          <div class="form-group">
            <input type="text" placeholder="watch url" name="watchUrl" />
          </div>

          <div class="form-group">
            <input type="text" placeholder="imdb" name="imdb" />
          </div>

          <div class="form-group">
            <input type="text" placeholder="run time minute" name="runtime" />
          </div>

          <div class="form-group select-wrapper">
            <select name="category">
              <option value="" disabled selected>category</option>
              <option value="action">Action</option>
              <option value="drama">Drama</option>
            </select>
            <span class="select-arrow">&#9660;</span>
          </div>

          <div class="form-footer">
            <label class="checkbox-label">
              Adult
              <input type="checkbox" name="isAdult" checked />
            </label>
            <button type="submit" class="btn-submit">Submit</button>
          </div>
        </form>

        <div class="modal-preview">
          <img src="../../assets/image/movie-poster.svg" alt="Movie Poster" />
        </div>
      </div>
    </div>
