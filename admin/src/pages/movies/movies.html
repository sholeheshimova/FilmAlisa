<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies</title>
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="./movies.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <img src="../../assets/icons/filmalisa-logo.svg" alt="" />
        </div>
        <span class="logo-text">filmalisa</span>
      </div>

      <nav class="sidebar-menu">
        <a href="../dashboard/dashboard.html" class="menu-item">
          <span class="menu-icon"
            ><img src="../../assets/icons/dashboard.svg" alt=""
          /></span>
          <span>Dashboard</span>
        </a>

        <a href="./movies.html" class="menu-item active">
          <span class="menu-icon"
            ><img src="../../assets/icons/movies.svg" alt=""
          /></span>
          <span>Movies</span>
        </a>

        <a href="../categories/categories.html" class="menu-item">
          <span class="menu-icon"
            ><img src="../../assets/icons/categories.svg" alt=""
          /></span>
          <span>Categories</span>
        </a>

        <a href="../users/users.html" class="menu-item">
          <span class="menu-icon"
            ><img src="../../assets/icons/users.svg" alt=""
          /></span>
          <span>Users</span>
        </a>

        <a href="../comments/comments.html" class="menu-item">
          <span class="menu-icon"
            ><img src="../../assets/icons/comments.svg" alt=""
          /></span>
          <span>Comments</span>
        </a>

        <a href="../contactus/contactus.html" class="menu-item">
          <span class="menu-icon"
            ><img src="../../assets/icons/contact.svg" alt=""
          /></span>
          <span>Contact us</span>
        </a>

        <a href="../actors/actors.html" class="menu-item">
          <span class="menu-icon"
            ><img src="../../assets/icons/users.svg" alt=""
          /></span>
          <span>Actors</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <a href="../../../index.html" class="logout">
          <span class="logout-icon"
            ><img src="../../assets/icons/logaut.svg" alt=""
          /></span>
          <span>Logout</span>
        </a>
      </div>
    </aside>

    <!-- Page Header -->

    <main class="main-content">
      <header class="admin-header">
        <div class="header-left">
          <span class="header-greeting">Hi Admin</span>
          <h1>Movies</h1>
        </div>

        <div class="header-right">
          <button class="create-btn">Create</button>

          <div class="profile">
            <div class="profile-image">
              <img src="../../assets/image/admin-profile.svg" alt="Admin" />
            </div>

            <span class="profile-name">Admin</span>
          </div>
        </div>
      </header>
      <section class="page-content">
        <div class="movies-table-wrap">
          <table class="movies-table">
            <thead>
              <tr>
                <th class="col-id">ID</th>
                <th class="col-title">Title</th>
                <th>Overview</th>
                <th>Category</th>
                <th>IMDB</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>1</td>
                <td>
                  <div class="movie-title-cell">
                    <img
                      class="movie-poster"
                      src="../../assets/image/movie-poster.svg"
                      alt="Lost in space"
                    />
                    Lost in space
                  </div>
                </td>
                <td>Lorem ipsum test...</td>
                <td>Action</td>
                <td>7.6</td>
                <td>
                  <button><i class="fa-solid fa-pen-to-square"></i></button>
                  <button><i class="fa-solid fa-trash"></i></button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- modaldı js aktiv olduğdan soram qoşulacaq  -->

    <div class="modal-overlay">
      <div class="create-modal-card">
        <form class="modal-form">
          <div class="form-group">
            <input type="text" placeholder="title" name="title" />
          </div>

          <div class="form-group">
            <textarea
              placeholder="overview"
              name="overview"
              rows="3"
            ></textarea>
          </div>

          <div class="form-group">
            <input type="text" placeholder="cover url" name="coverUrl" />
          </div>

          <div class="form-group">
            <input
              type="text"
              placeholder="fragman (youtube embed url)"
              name="trailerUrl"
            />
          </div>

          <div class="form-group">
            <input type="text" placeholder="watch url" name="watchUrl" />
          </div>

          <div class="form-group">
            <input type="text" placeholder="imdb" name="imdb" />
          </div>

          <div class="form-group">
            <input type="text" placeholder="run time minute" name="runtime" />
          </div>

          <div class="form-group select-wrapper">
            <select name="category">
              <option value="" disabled selected>category</option>
              <option value="action">Action</option>
              <option value="drama">Drama</option>
            </select>
            <span class="select-arrow">&#9660;</span>
          </div>

          <div class="form-footer">
            <label class="checkbox-label">
              Adult
              <input type="checkbox" name="isAdult" checked />
            </label>
            <button type="submit" class="btn-submit">Submit</button>
          </div>
        </form>

        <div class="modal-preview">
          <img src="../../assets/image/movie-poster.svg" alt="Movie Poster" />
        </div>
      </div>
    </div>
    <script src="./movies.js"></script>
  </body>
</html>
