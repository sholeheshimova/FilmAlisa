<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./register.css" />
    <link
      rel="icon"
      href="../../assests/images/logo_with_uploaded_image (1).png"
      type="image/png"
    />

    <title>Register</title>
  </head>
  <body>
    <main class="login-container">
      <img
        class="logo"
        src="../../assests/icons/login/logo.svg"
        alt="filmalisa-logo"
      />

      <h1 class="login-title">filmalisa</h1>
      <p class="login-desc">register</p>

      <form class="form-box">
        <div class="input-box">
          <img src="../../assests/icons/login/sms.svg" alt="sms" />
          <input
            id="username"
            class="input username"
            type="text"
            placeholder="username"
          />
        </div>
        <div class="input-box">
          <img src="../../assests/icons/login/sms.svg" alt="sms" />
          <input
            id="email"
            class="input email"
            type="email"
            placeholder="email"
          />
        </div>

        <div class="input-box">
          <img src="../../assests/icons/login/password.svg" alt="password" />
          <input
            id="password"
            class="input password"
            type="password"
            placeholder="password"
          />
          <img
            id="password-eye"
            src="../../assests/icons/login/eye.svg"
            alt="eye"
          />
        </div>
        <a class="login-link" href="../login/login.html"
          >Do you have a account? Login here</a
        >

        <button id="login-button" class="login-button">
          <a href="../home/home.html">register</a>
        </button>
      </form>
    </main>
  </body>
</html>
