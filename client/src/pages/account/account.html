<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./account.css" />
    <link rel="icon" href="../../assests/images/logo_with_uploaded_image (1).png" type="image/png" />
</head>

<body class="bg-dark text-light">
    <main class="account-body">
        <div class="left">
            <div class="logo-div">
                <img src="../../assests/icons/user-home/logo-user.svg" alt="Logo" />
            </div>
            <div class="sidebar">
                <a href="../home/home.html" class="icon">
                    <img src="../../assests/icons/user-home/icon-1.svg" alt="Home" />
                </a>
                <a href="../searchPanel/search.html" class="icon">
                    <img src="../../assests/icons/user-home/icon-2.svg" alt="Saerch" />
                </a>
                <a href="./account.html" class="icon active">
                    <img src="../../assests/icons/user-home/icon-3.svg" alt="Account" />
                </a>
                <a href="../favorite/favorite.html" class="icon">
                    <img src="../../assests/icons/user-home/icon-4.svg" alt="Favorites" />
                </a>
            </div>
        </div>

        <div class="right-part">
            <figure id="image-frame" class="image-frame">
                <img src="../../assests/images/user-image.png" id="image" />
            </figure>
            <form id="form">
                <div class="form-group">
                     <i class="fa-regular fa-image input-icon" ></i>
                    <input type="text" placeholder="profile image url" required />
                </div>
                <div class="form-group">
                     <i class="fa-regular fa-address-card input-icon"></i>
                    <input type="text" placeholder="fullname" required />
                </div>
                <div class="form-group">
                    <div>
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="text" id="email" placeholder="email.com" required />
                    </div>
                    
                </div>
                <div class="form-group">
                    <i class="fa-solid fa-key input-icon"></i>
                    <input type="password" placeholder="password" required />
                    
                </div>

                <button type="submit" class="register-btn">Save</button>
            </form>
        </div>
        <div class="popup" id="popup">
            <p id="pop-p"></p>
            <button class="close-btn" onclick="closePopup()">Close</button>
        </div>
    </main>

    <script src="./account.js"></script>
</body>

</html>
