<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account</title>
    <link rel="stylesheet" href="./account.css" />
    <!-- <link rel="stylesheet" href="../../styles/loader.css"> -->
    <link rel="icon" href="../../assests/images/logo_with_uploaded_image (1).png" type="image/png" />
</head>

<body class="bg-dark text-light">

        <div class="loader-wrapper">
            <div class="loader-ring-1"></div>
            <div class="loader-ring-2"></div>

        <p class="loader-label">Yüklənir</p>

    <main class="account-body">
        <div class="left">
            <div class="logo-div">
                <img src="../../assests/icons/user-home/logo-user.svg" alt="Logo" />
            </div>
            <div class="sidebar">
                <a href="../home/home.html" class="icon">
                    <img src="../../assests/icons/user-home/icon-1.svg" alt="Home" />
                </a>
                <a href="../searchPanel/search.html" class="icon">
                    <img src="../../assests/icons/user-home/icon-2.svg" alt="Saerch" />
                </a>
                <a href="./account.html" class="icon">
                    <img src="../../assests/icons/user-home/icon-3.svg" alt="Account" />
                </a>
                <a href="../favorite/favorite.html" class="icon">
                    <img src="../../assests/icons/user-home/icon-4.svg" alt="Favorites" />
                </a>
            </div>
        </div>

        <div class="right-part">
            <figure id="image-frame" class="image-frame">
                <img src="../../assests/images/user-image.png" id="image" />
            </figure>
            <form id="form">
                <div class="form-group">
                    <img src="../../assests/icons/Client-login/left-icon.svg" alt="fullname" class="input-icon" />
                    <input type="text" placeholder="profile image url" required />
                </div>
                <div class="form-group">
                    <img src="../../assests/icons/Client-login/left-icon.svg" alt="fullname" class="input-icon" />
                    <input type="text" placeholder="fullname" required />
                </div>
                <div class="form-group">
                    <div>
                        <img src="../../assests/icons/login/login_messages.svg" alt="username" class="input-icon" />
                    </div>
                    <input type="text" id="email" placeholder="Email.com" readonly />
                </div>
                <div class="form-group">
                    <img src="../../assests/icons/Client-login/lpassword-icon.svg" alt="password" class="input-icon" />
                    <input type="password" placeholder="password" required />
                    <img src="../../assests/icons/Client-login/right-icon.svg" alt="password-right"
                        class="input-icon" />
                </div>

                <button type="submit" class="register-btn">Save</button>
            </form>
        </div>
        <div class="popup" id="popup">
            <p id="pop-p"></p>
            <button class="close-btn" onclick="closePopup()">Close</button>
        </div>
    </main>

    <script src="./account.js"></script>
</body>

</html>
