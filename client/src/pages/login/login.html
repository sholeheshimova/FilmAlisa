<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./login.css" />
    <link
      rel="icon"
      href="../../assests/images/logo_with_uploaded_image (1).png"
      type="image/png"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Login</title>
  </head>
  <body>
    <main class="login-container">
      <img
        class="logo"
        src="../../assests/icons/login/logo.svg"
        alt="filmalisa-logo"
      />

      <h1 class="login-title">filmalisa</h1>
      <p class="login-desc">login</p>

      <form class="form-box">
        <div class="input-box">
          <i
            class="fa-regular fa-user"
            style="color: var(--login-register-input-text-color)"
          ></i>
          <input
            id="username"
            class="input username"
            type="text"
            placeholder="username"
          />
        </div>

        <div class="input-box">
          <img src="../../assests/icons/login/password.svg" alt="password" />
          <input
            id="password"
            class="input password"
            type="password"
            placeholder="password"
          />
          <img
            id="password-eye"
            src="../../assests/icons/login/eye.svg"
            alt="eye"
          />
        </div>
        <a class="register-link" href="../register/register.html"
          >Register here</a
        >

        <button id="login-button" class="login-button">
          <a href="../home/home.html">login</a>
        </button>
      </form>
    </main>
  </body>
</html>
