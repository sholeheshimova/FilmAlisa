<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./login.css" />
    <link rel="stylesheet" href="../../styles/loader.css" />
    <link
      rel="icon"
      href="../../assests/images/logo_with_uploaded_image (1).png"
      type="image/png"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Login</title>
  </head>
  <body>
    <div id="page-loader" role="status" aria-label="Loading">
      <div class="loader-wrapper">
        <div class="loader-ring-1"></div>
        <div class="loader-ring-2"></div>
        <div class="loader-ring-3"></div>
        <div class="loader-dot"></div>
      </div>
      <p class="loader-label">Loading</p>
      <div class="loader-dots"><span></span><span></span><span></span></div>
    </div>
    <main class="login-container">
      <img
        class="logo"
        src="../../assests/icons/login/logo.svg"
        alt="filmalisa-logo"
      />

      <h1 class="login-title">filmalisa</h1>
      <p class="login-desc">login</p>

      <form class="form-box">
        <div class="input-box">
          <i
           class="fa-regular fa-envelope"
            style="color: var(--login-register-input-text-color)"
          ></i>
          <input
            id="email"
            class="input email"
            type="email"
            placeholder="email"
          />
        </div>

        <div class="input-box">
          <img src="../../assests/icons/login/password.svg" alt="password" />
          <input
            id="password"
            class="input password"
            type="password"
            placeholder="password"
          />
          <img
            id="password-eye"
            src="../../assests/icons/login/eye.svg"
            alt="eye"
          />
        </div>
        <a class="register-link" href="../register/register.html"
          >Register here</a
        >


        <!-- <a href="../home/home.html" class="login-button">Login</a> -->
         <button type="submit" class="login-button">Login</button>
      </form>
    </main>


    <script type="module" src="./login.js"></script>
    <script src="../../Scripts/Client/loader.js"></script>
  </body>
</html>
