<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Search</title>

    <link rel="stylesheet" href="./search.css" />
    <link rel="stylesheet" href="./search-responsive.css" />
    <link rel="stylesheet" href="../../styles/loader.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <link
      rel="icon"
      href="../../assests/images/logo_with_uploaded_image (1).png"
      type="image/png"
    />
  </head>

  <body>
    <div id="page-loader" role="status" aria-label="Loading">
      <div class="loader-wrapper">
        <div class="loader-ring-1"></div>
        <div class="loader-ring-2"></div>
        <div class="loader-ring-3"></div>
        <div class="loader-dot"></div>
      </div>
      <p class="loader-label">Loading</p>
      <div class="loader-dots"><span></span><span></span><span></span></div>
    </div>

    <div class="container">
      <main class="search-page">
        <!-- SIDEBAR -->
        <div class="left">
          <div class="logo-div">
            <a href="../../../../index.html">
              <img
                src="../../assests/icons/user-home/logo-user.svg"
                alt="Logo"
              />
            </a>
          </div>

          <div class="sidebar">
            <a href="../home/home.html" class="icon">
              <img src="../../assests/icons/user-home/icon-1.svg" alt="Home" />
            </a>

            <a href="./search.html" class="icon active">
              <img
                src="../../assests/icons/user-home/icon-2.svg"
                alt="Search"
              />
            </a>

            <a href="../account/account.html" class="icon">
              <img
                src="../../assests/icons/user-home/icon-3.svg"
                alt="Account"
              />
            </a>

            <a href="../favorite/favorite.html" class="icon">
              <img
                src="../../assests/icons/user-home/icon-4.svg"
                alt="Favorites"
              />
            </a>
          </div>
        </div>

        <!-- SEARCH CONTENT -->
        <section class="search-content">
          <div class="search-result">
            <!-- HEADER -->
            <div class="result-header">
              <div class="result-title">
                <h2>Search result</h2>

                <span class="arrow">›</span>
              </div>

              <!-- SEARCH INPUT -->
              <div class="search-panel">
                <input type="text" class="search-input" placeholder="Search" />

                <button class="search-button">
                  <i class="fa-solid fa-magnifying-glass"></i>
                </button>
              </div>
            </div>

            <!-- MOVIE CARDS -->
            <div class="movies-grid"></div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./search.js"></script>
    <script src="../../Scripts/Client/loader.js"></script>
  </body>
</html>
